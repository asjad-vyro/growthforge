name: imagine-mcp tools drift

on:
  schedule:
    - cron: "0 6 * * *" # nightly, 06:00 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-imagine-tools-drift.mjs
        env:
          IMAGINE_MCP_URL: ${{ secrets.IMAGINE_MCP_URL }}
          IMAGINE_MCP_ACCESS_TOKEN: ${{ secrets.IMAGINE_MCP_ACCESS_TOKEN }}
